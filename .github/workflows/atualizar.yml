name: Atualizar XP do grupo

# De hora em hora: busca os dados no Wise Old Man, grava data.json e publica o site.
# O agendamento do GitHub atrasa e descarta execuções com frequência, então ele tenta
# a cada 15 minutos e só publica quando os dados no ar já têm 55 minutos ou mais.
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:       # botão "Run workflow" na aba Actions
    inputs:
      enviar_resumo:
        description: 'Mandar o resumo no WhatsApp agora (teste)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-xp
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publicar: ${{ steps.idade.outputs.publicar }}
    steps:
      - name: Ver a idade dos dados publicados
        id: idade
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "publicar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gen=$(curl -fsS "https://mymax1337.github.io/xp-grupo-gim/data.json?t=$(date +%s)" | jq -r '.generatedAt // empty' || true)
          if [ -z "$gen" ]; then echo "publicar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          idade=$(( $(date +%s) - $(date -d "$gen" +%s) ))
          echo "Dados no ar têm $(( idade / 60 )) min"
          if [ "$idade" -ge $(( 55 * 60 )) ]; then echo "publicar=true" >> "$GITHUB_OUTPUT"; else echo "publicar=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.idade.outputs.publicar == 'true'

      - uses: actions/setup-node@v5
        if: steps.idade.outputs.publicar == 'true'
        with:
          node-version: 24

      - name: Buscar dados no Wise Old Man
        if: steps.idade.outputs.publicar == 'true'
        run: |
          mkdir -p _site
          cp -r index.html icons _site/
          node scripts/coletar.mjs _site/data.json

      # Na primeira execução depois da meia-noite (Brasília) gera o resumo do dia que acabou e manda no WhatsApp
      # pelo CallMeBot; se ela falhar, qualquer execução seguinte faz o que faltou.
      # O número e a chave ficam nos segredos do repositório, nunca no código.
      - name: Resumo do dia
        if: steps.idade.outputs.publicar == 'true'
        continue-on-error: true
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FORCAR_RESUMO: ${{ github.event.inputs.enviar_resumo }}
        run: node scripts/resumo.mjs _site/data.json

      - uses: actions/upload-pages-artifact@v4
        if: steps.idade.outputs.publicar == 'true'
        with:
          path: _site

      # O GitHub desliga agendamentos de repositórios públicos sem commits há 60 dias.
      - name: Manter o agendamento ativo
        if: steps.idade.outputs.publicar == 'true'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantém a atualização automática ativa"
            git push
          fi

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
