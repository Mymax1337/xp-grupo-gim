name: Atualizar XP do grupo

# De hora em hora: busca os dados no Wise Old Man, grava data.json e publica o site.
on:
  schedule:
    - cron: '7 * * * *'   # todo hora, aos 7 minutos
  workflow_dispatch:       # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-xp
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Buscar dados no Wise Old Man
        run: |
          mkdir -p _site
          cp index.html _site/
          node scripts/coletar.mjs _site/data.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # O GitHub desliga agendamentos de repositórios públicos sem commits há 60 dias.
      - name: Manter o agendamento ativo
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantém a atualização automática ativa"
            git push
          fi

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
